name: Uranium Fist Android Node Builder

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Uranium Fist Operational APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (8.5)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Scaffold Android Project
        run: |
          mkdir -p app/src/main/java/com/uranium/fist app/src/main/res/values app/src/main/assets
          
          cat << 'EOF' > app/src/main/AndroidManifest.xml
