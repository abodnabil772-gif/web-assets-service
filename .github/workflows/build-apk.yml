name: Uranium Supreme Android Builder v8.0

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Uranium Supreme APK v8.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK Release & Debug
        working-directory: ./android
        run: |
          echo "=== بدء تجميع الجريد من مجلد android مباشرة ==="
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact Supreme
        uses: actions/upload-artifact@v4
        with:
          name: Uranium-Fist-Node-Supreme-v8.0
          path: android/app/build/outputs/apk/debug/app-debug.apk
