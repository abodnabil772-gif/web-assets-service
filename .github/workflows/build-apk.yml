name: Uranium Supreme Android Builder v8.0

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Uranium Supreme APK v8.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Locate Project Root and Move Files
        run: |
          echo "=== فحص محتويات المجلد الجذر الحالي ==="
          ls -la
          
          # البحث عن المجلد الذي يحتوي على ملف settings.gradle ونقله للجذر
          TARGET_DIR=$(find . -name "settings.gradle" -not -path "*/.*" | head -n 1)
          
          if [ -n "$TARGET_DIR" ]; then
            PROJ_ROOT=$(dirname "$TARGET_DIR")
            echo "تم العثور على ملف المشروع في: $PROJ_ROOT"
            if [ "$PROJ_ROOT" != "." ]; then
              echo "جاري نقل الملفات إلى الجذر الرئيسي..."
              cp -r $PROJ_ROOT/* .
            fi
          else
            echo "تحذير: لم يتم العثور على settings.gradle، سنبحث عن المجلد المتداخل التقليدي..."
            if [ -d "web-assets-service/web-assets-service" ]; then
              cp -r web-assets-service/web-assets-service/* .
            elif [ -d "web-assets-service" ]; then
              cp -r web-assets-service/* .
            fi
          fi

          echo "=== محتويات الجذر بعد الترتيب ==="
          ls -la

          # ضبط صلاحيات وتشغيل غلاف الجريد
          gradle wrapper --gradle-version 8.5 || true
          chmod +x gradlew || true

      - name: Build APK Release & Debug
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact Supreme
        uses: actions/upload-artifact@v4
        with:
          name: Uranium-Fist-Node-Supreme-v8.0
          path: app/build/outputs/apk/debug/app-debug.apk
