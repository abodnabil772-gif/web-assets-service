name: Royal Iron Fist Node Builder v11.0 Sultan Kingdom

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Royal Iron Fist Operational APK v11.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (8.5)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build APK Debug inside Android Directory
        env:
          NODE_HMAC_KEY: ${{ secrets.NODE_HMAC_KEY }}
        run: |
          cd android
          gradle app:assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Royal-Iron-Fist-v11.0-SultanKingdom
          path: '**/app/build/outputs/apk/debug/app-debug.apk'
