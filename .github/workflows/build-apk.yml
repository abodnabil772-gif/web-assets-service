name: Build Stealth Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Auto-Fix Android SDK Path for GitHub Runner
        run: |
          # مسح أي إعدادات مسار يدوية قديمة وضبط المسار الصحيح المعتمد في خوادم جيت هاب
          rm -f android/local.properties
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          
          # قبول كافة تراخيص أندرويد تلقائياً لمنع تعليق البناء
          yes | npx license-checker --production || true

      - name: Generate Fresh Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Android App Release (APK)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Upload Output Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: Stealth-Core-Application
          path: android/app/build/outputs/apk/release/app-release.apk
