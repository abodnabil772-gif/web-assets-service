name: Uranium Supreme Android Builder v8.0

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Uranium Supreme APK v8.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Detect Project Path
        id: detect
        run: |
          echo "=== فحص محتويات مسار العمل الحالي ==="
          pwd
          ls -la
          
          # البحث عن المجلد الذي يحتوي على ملف settings.gradle
          TARGET_DIR=$(find . -name "settings.gradle" -not -path "*/.*" -exec dirname {} \; | head -n 1)
          
          if [ -n "$TARGET_DIR" ] && [ "$TARGET_DIR" != "." ]; then
            echo "project_path=$TARGET_DIR" >> $GITHUB_OUTPUT
            echo "تم تحديد مسار المشروع في: $TARGET_DIR"
          else
            echo "project_path=." >> $GITHUB_OUTPUT
            echo "المشروع موجود في الجذر الرئيسي."
          fi

      - name: Build APK Release & Debug
        working-directory: ${{ steps.detect.outputs.project_path }}
        run: |
          echo "=== بدء تجميع الجريد من المسار الصحيح ==="
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact Supreme
        uses: actions/upload-artifact@v4
        with:
          name: Uranium-Fist-Node-Supreme-v8.0
          path: '**/build/outputs/apk/debug/app-debug.apk'
