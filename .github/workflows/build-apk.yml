name: Build Android APK (Ultimate Fix)

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android App Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Clean and Build APK Debug
        run: ./gradlew clean assembleDebug --stacktrace
        env:
          ORG_GRADLE_PROJECT_android_useAndroidX: true
          ORG_GRADLE_PROJECT_android_enableJetifier: true

      - name: Upload Output Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
