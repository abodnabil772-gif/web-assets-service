name: Build Stealth Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Auto-Fix Android Environment Paths & Licenses
        run: |
          rm -f android/local.properties
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android App Release (APK)
        run: |
          cd android
          # توليد ملفات gradle wrapper المفقودة برمجياً داخل بيئة جيت هاب أولاً
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          # تشغيل التجميع الفوري والتصدير مع عرض تفاصيل الأخطاء
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Output Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: Stealth-Core-Application
          path: android/app/build/outputs/apk/release/app-release.apk
