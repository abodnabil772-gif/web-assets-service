name: Uranium Fist Android Node Supreme Builder v8.0

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Uranium Supreme APK v8.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Verify Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/uranium/fist app/src/main/res/values app/src/main/assets
          echo "[+] Directory structure verified successfully by Sultan Naser Al-Kalai."

      - name: Build APK Release & Debug
        run: |
          chmod +x gradlew || true
          gradle app:assembleDebug

      - name: Upload APK Artifact Supreme
        uses: actions/upload-artifact@v4
        with:
          name: Uranium-Fist-Node-Supreme-v8.0
          path: app/build/outputs/apk/debug/app-debug.apk
