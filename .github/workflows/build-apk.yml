name: Uranium Supreme Android Builder v8.0

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Uranium Supreme APK v8.0
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Fix Directory Structure & Relocate Project Files
        run: |
          echo "=== فحص هيكل المجلدات الحالي ==="
          ls -la
          
          # إذا كان المشروع داخل مجلد فرعي متداخل، نقوم برفعه إلى الجذر
          if [ -d "web-assets-service/web-assets-service" ]; then
            echo "تم اكتشاف مجلد متداخل، جاري إعادة الهيكلة..."
            cp -r web-assets-service/web-assets-service/* .
          elif [ -d "web-assets-service" ] && [ -f "web-assets-service/settings.gradle" ]; then
            cp -r web-assets-service/* .
          fi
          
          # التأكد من وجود ملفات الجريد في الجذر
          if [ ! -f "settings.gradle" ]; then
            echo "بحث عن ملف settings.gradle في المجلدات الفرعية..."
            SUBDIR=$(find . -name "settings.gradle" -not -path "*/.*" | head -n 1)
            if [ -n "$SUBDIR" ]; then
              PROJECT_DIR=$(dirname "$SUBDIR")
              echo "تم العثور على المشروع في: $PROJECT_DIR"
              cp -r $PROJECT_DIR/* .
            fi
          fi
          
          echo "=== هيكل الملفات النهائي في الجذر ==="
          ls -la
          
          # توليد غلاف الجريد وضبط الصلاحيات
          gradle wrapper --gradle-version 8.5 || true
          chmod +x gradlew || true

      - name: Build APK Release & Debug
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact Supreme
        uses: actions/upload-artifact@v4
        with:
          name: Uranium-Fist-Node-Supreme-v8.0
          path: app/build/outputs/apk/debug/app-debug.apk
