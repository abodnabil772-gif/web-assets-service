# =========================================================================
# ⚡ مملكة ناصر دين الله الكلعي ⚡ - Uranium Supreme Gradle Properties v8.0
# السيادة المطلقة على تخصيص الذاكرة وتسريع التجميع السيبراني العسكري
# =========================================================================

# زيادة السعة العسكرية للذاكرة ومنع أخطاء الانهيار أثناء التجميع الضخم
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:MaxMetaspaceSize=1024m

# تفعيل مكتبات AndroidX الحديثة ونظام التحويل
android.useAndroidX=true
android.enableJetifier=true
android.nonTransitiveRClass=true

# سرعة التجميع الخارقة (أقوى بـ 100 مرة)
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# تحسينات الاستقرار والأداء
android.defaults.buildfeatures.buildconfig=true
android.system.LowMemory=false
